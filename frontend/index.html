<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CampusMate</title>
  <meta name="description" content="Tugas, jadwal kuliah, mata kuliah, dan catatan dalam satu aplikasi. Tetap bisa dipakai tanpa internet.">
  <meta name="theme-color" content="#EDF0F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1226" media="(prefers-color-scheme: dark)">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CampusMate">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Font: URL ini harus sama persis dengan FONT_CSS di sw.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">

  <!-- Tailwind CSS via CDN: URL ini harus sama persis dengan TAILWIND di sw.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {}; // CDN gagal dimuat (belum pernah online): jangan lempar error
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: 'var(--paper)', card: 'var(--card)', ink: 'var(--ink)',
            mute: 'var(--mute)', line: 'var(--line)', mark: 'var(--mark)',
          },
          fontFamily: {
            sans: ['"Bricolage Grotesque"', 'ui-sans-serif', 'system-ui', '-apple-system', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    /* ---------- Token warna (terang, lalu gelap otomatis) ---------- */
    :root {
      color-scheme: light dark;
      --paper: #EDF0F9;
      --card: #FFFFFF;
      --ink: #131838;
      --mute: #5A6187;
      --line: #D9DEEE;
      --mark: #FFE24D;
      --coral: #B42A34;  --coral-bg: #FFE4E4;
      --leaf: #12704E;   --leaf-bg: #DCF3E7;  --leaf-on: #FFFFFF;
      --btn: #131838;    --btn-ink: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0E1226;
        --card: #181D3B;
        --ink: #EEF0FB;
        --mute: #A0A7CC;
        --line: #2A3160;
        --coral: #FF8A91;  --coral-bg: #3B1E2E;
        --leaf: #6FDCAB;   --leaf-bg: #123A33;  --leaf-on: #0E1226;
        --btn: #FFE24D;    --btn-ink: #131838;
      }
    }

    /* ---------- Dasar ---------- */
    html { -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-optical-sizing: auto; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    body:has(dialog[open]) { overflow: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ---------- Kerangka ---------- */
    .app { max-width: 42rem; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 30; background: var(--paper); padding-top: env(safe-area-inset-top); }
    .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .75rem 1rem .5rem; min-height: 3.25rem; }
    .wordmark { font-weight: 800; font-size: 1.25rem; letter-spacing: -.02em; }
    .status { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }
    .view { flex: 1; padding: .5rem 1rem 9rem; outline: none; }

    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .nav-inner { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 42rem; margin: 0 auto; }
    .navbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; min-height: 58px; padding: .5rem .25rem; font-size: .75rem; font-weight: 600; color: var(--mute); background: none; border: 0; }
    .navbtn[aria-current="page"] { color: var(--ink); }

    .fab { position: fixed; right: 1rem; bottom: calc(env(safe-area-inset-bottom) + 4.75rem); z-index: 35; box-shadow: 0 10px 24px rgba(19, 24, 56, .3); border-radius: 999px; padding: 0 1.4rem 0 1.1rem; }

    @media (min-width: 768px) {
      .nav { position: static; background: transparent; border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 0; }
      .navbtn { flex-direction: row; gap: .5rem; font-size: .95rem; min-height: 48px; }
      .fab { bottom: 2rem; right: max(1rem, calc((100vw - 42rem) / 2)); }
      .view { padding-bottom: 7rem; }
    }

    /* ---------- Stabilo: satu-satunya penanda warna mencolok ---------- */
    .hl {
      background: linear-gradient(to bottom, transparent 44%, var(--mark) 44%, var(--mark) 92%, transparent 92%);
      color: inherit; padding: 0 .3em; margin: 0 -.3em;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
    }
    @media (prefers-color-scheme: dark) {
      .hl { background: var(--mark); color: #131838; border-radius: 5px; padding: .05em .4em; margin: 0 -.1em; }
    }

    /* ---------- Tombol, kolom isian, chip ---------- */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 48px; padding: 0 1.25rem; border-radius: 14px; border: 0; font-weight: 700; background: var(--btn); color: var(--btn-ink); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
    .btn-danger { background: transparent; color: var(--coral); border: 1.5px solid var(--coral); }
    .btn:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 2px; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--paper); border: 0; color: var(--ink); flex: none; }

    .lbl { display: block; font-size: .8125rem; font-weight: 600; color: var(--mute); margin-bottom: .35rem; }
    .field { display: block; width: 100%; min-height: 48px; padding: .65rem .85rem; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); box-sizing: border-box; }
    textarea.field { resize: vertical; line-height: 1.5; }
    .field::placeholder { color: var(--mute); opacity: .8; }

    .chip { --chip: var(--paper); --chip-ink: var(--mute); --chip-ring: var(--line);
      display: inline-flex; align-items: center; gap: .3rem; max-width: 100%; font-size: .75rem; font-weight: 600; line-height: 1;
      padding: .38rem .6rem; border-radius: 999px; background: var(--chip); color: var(--chip-ink); box-shadow: inset 0 0 0 1px var(--chip-ring);
      border: 0; text-decoration: none; }
    .chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-mark  { --chip: var(--mark); --chip-ink: #131838; --chip-ring: transparent; }
    .chip-coral { --chip: var(--coral-bg); --chip-ink: var(--coral); --chip-ring: transparent; }
    .chip-leaf  { --chip: var(--leaf-bg); --chip-ink: var(--leaf); --chip-ring: transparent; }
    .chip-ink   { --chip: var(--ink); --chip-ink: var(--paper); --chip-ring: transparent; }
    button.chip { min-height: 36px; cursor: pointer; }

    /* ---------- Judul tampilan, daftar, kartu ---------- */

    .item { display: flex; align-items: flex-start; gap: .25rem; padding: .5rem; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
    .item[data-pending] { border-style: dashed; }
    .item-main { flex: 1; min-width: 0; display: block; text-align: left; background: none; border: 0; padding: .5rem .5rem .5rem .25rem; border-radius: 12px; }
    .item > .item-main:first-child { padding-left: .75rem; }
    .item-main.row { display: flex; gap: 1rem; align-items: flex-start; }
    .item-title { display: block; font-weight: 700; font-size: 1.0625rem; line-height: 1.3; overflow-wrap: anywhere; }
    .item[data-done] .item-title { text-decoration: line-through; color: var(--mute); }
    .item[data-past] { opacity: .6; }
    .item-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: .35rem; color: var(--mute); font-size: .9rem; line-height: 1.4; overflow-wrap: anywhere; }

    .check { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: none; border: 0; padding: 0; }
    .check > span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--mute); display: grid; place-items: center; color: var(--leaf-on); }
    .check[aria-checked="true"] > span { background: var(--leaf); border-color: var(--leaf); }

    .thumb { position: relative; flex: none; width: 64px; height: 64px; margin: .25rem .25rem 0 0; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: var(--paper); border: 1px solid var(--line); color: var(--mute); }
    .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .thumb.thumb-off img { display: none; }

    .sks { flex: none; width: 56px; margin: .25rem .25rem 0 0; padding: .55rem 0; border-radius: 14px; background: var(--paper); display: flex; flex-direction: column; align-items: center; }
    .sks b { font-size: 1.5rem; line-height: 1; font-weight: 800; }
    .sks small { margin-top: .2rem; font-size: .7rem; font-weight: 700; color: var(--mute); }


    .segbtn { flex: none; min-height: 40px; padding: 0 .95rem; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font-weight: 600; font-size: .875rem; }
    .segbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .segbtn .n { margin-left: .4rem; opacity: .75; font-variant-numeric: tabular-nums; }

    .daytab { position: relative; min-height: 48px; padding: 0; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--mute); font-weight: 700; font-size: .875rem; }
    .daytab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .daytab i { position: absolute; left: 50%; bottom: 6px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor; }

    .empty { padding: 2rem 1.25rem; text-align: center; color: var(--mute); border: 1.5px dashed var(--line); border-radius: 18px; }
    .empty strong { display: block; color: var(--ink); font-size: 1.0625rem; margin-bottom: .25rem; }

    /* ---------- Sheet form (dialog) ---------- */
    dialog#sheet { margin: auto auto 0 auto; width: 100%; max-width: 40rem; max-height: 92dvh; padding: 0; border: 0; border-radius: 24px 24px 0 0; background: var(--card); color: var(--ink); overflow: hidden; }
    dialog#sheet::backdrop { background: rgba(10, 14, 40, .6); }
    dialog#sheet[open] { animation: sheet-up .22s ease-out; }
    @keyframes sheet-up { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (min-width: 768px) { dialog#sheet { margin: auto; border-radius: 24px; } }
    #sheet form { display: flex; flex-direction: column; max-height: 92dvh; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.25rem .5rem; }
    .sheet-head h2 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -.025em; }
    .sheet-body { display: grid; gap: 1rem; padding: .5rem 1.25rem 1rem; overflow-y: auto; }
    .sheet-foot { display: flex; gap: .75rem; padding: .75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
    .preview { display: flex; align-items: center; gap: .75rem; padding: .6rem; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    .preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; flex: none; }
    .preview .name { flex: 1; min-width: 0; font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
    .preview .name small { display: block; font-weight: 400; color: var(--mute); }

    /* ---------- Toast (popover agar tampil di atas dialog) ---------- */
    /* Di bawah, di atas tombol tambah, supaya logo dan chip Offline/sinkron di header tidak tertutup. width: max-content mencegah teks terpotong jadi 3 baris. */
    #toast { position: fixed; inset: auto; bottom: calc(env(safe-area-inset-bottom) + 9.5rem); left: 50%; transform: translateX(-50%); margin: 0; padding: .75rem 1rem; width: max-content; max-width: min(92vw, 28rem); border: 0; border-radius: 14px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: .9rem; text-align: center; display: none; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); }
    #toast.show { display: block; }
    @media (min-width: 768px) { #toast { bottom: 2rem; } }
    #toast[data-kind="error"] { background: var(--coral); color: #fff; }
    @media (prefers-color-scheme: dark) { #toast[data-kind="error"] { color: #0E1226; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <span class="wordmark">CampusMate</span>
        <div id="status" class="status"></div>
      </div>
      <nav class="nav" aria-label="Menu utama">
        <div class="nav-inner" id="nav"></div>
      </nav>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <button id="fab" class="btn fab" type="button" data-action="add"></button>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" popover="manual" role="status" aria-live="polite"></div>

  <noscript><p style="padding:1rem">CampusMate membutuhkan JavaScript untuk berjalan.</p></noscript>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
